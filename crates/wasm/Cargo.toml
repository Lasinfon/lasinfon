[package]
name = "lasinfon-wasm"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
lasinfon-core = { path = "../core" }
lasinfon-state = { path = "../state" }
lasinfon-config = { path = "../config" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
