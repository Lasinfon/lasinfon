<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lasinfon (v5.1.2) - Public Opinion Weather Radar</title>
    <style>
        body { background: #0f141c; color: #e2e8f0; font-family: monospace; padding: 20px; }
        .container { display: flex; gap: 20px; max-width: 1200px; margin: 0 auto; }
        .control-panel { width: 350px; background: #1a202c; padding: 15px; border-radius: 8px; }
        .display-panel { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .canvas-container { display: flex; gap: 20px; }
        canvas { background: #0b0f17; border: 1px solid #2d3748; border-radius: 4px; }
        .btn { background: #4a5568; border: none; color: white; padding: 10px; width: 100%; cursor: pointer; border-radius: 4px; }
        .btn:hover { background: #718096; }
        label { display: block; margin-top: 10px; font-size: 12px; color: #a0aec0; }
        select, input { width: 100%; background: #2d3748; border: 1px solid #4a5568; color: white; padding: 5px; box-sizing: border-box; }
        pre { background: #0b0f17; padding: 10px; border-radius: 4px; font-size: 11px; overflow-x: auto; max-height: 200px; }
    </style>
</head>
<body>

<h2>LASINFON - Autonomous Self-Growing Propagation Dashboard (v5.1.2)</h2>

<div class="container">
    <div class="control-panel">
        <label>Scenario:</label>
        <select id="preset-selector">
            <option value="video">A. Tier-2 city + Short-video + Gen Z</option>
            <option value="professional">B. Global hub + Professional network + Parents</option>
        </select>

        <label>Max ticks:</label>
        <input type="number" id="ticks" value="15">

        <label>Noise sigma:</label>
        <input type="number" id="sigma" value="0.05" step="0.01">

        <label>Seed:</label>
        <input type="number" id="seed" value="123">

        <button class="btn" id="run-btn" style="margin-top:20px;">Run Simulation</button>
    </div>

    <div class="display-panel">
        <div class="canvas-container">
            <div>
                <div style="font-size:12px; margin-bottom:5px;">Atomic polarization grid (12×12 C_t)</div>
                <canvas id="grid-canvas" width="240" height="240"></canvas>
            </div>
            <div style="flex:1">
                <div style="font-size:12px; margin-bottom:5px;">Coherent intensity curve (G_t vs time)</div>
                <canvas id="chart-canvas" width="450" height="240"></canvas>
            </div>
        </div>
        <div>
            <div style="font-size:12px; margin-bottom:5px;">WASM raw output JSON</div>
            <pre id="json-output">// Results will appear here...</pre>
        </div>
    </div>
</div>

<script type="module">
    import init, { simulate } from './pkg/lasinfon_wasm.js';

    // Static scenario definitions (no external dependencies)
    const presets = {
        video: {
            config: {
                system: { alpha: 0.2 },
                stochastic: { eta: 0.3, theta: 0.01, gamma_saturation: 0.5 },
                state_transfer: {
                    gamma_social_proof: 0.5, gamma_self_catalysis: 0.1, gamma_social_pressure: 0.3,
                    gamma_algo_trending: 0.05, attention_decay: 0.0, lambda_R_relaxation: 0.1,
                    lambda_K_relaxation: 0.1, lambda_C_relaxation: 0.3
                },
                omega: { trigger_T: 6, trigger_R: 7, trigger_social_currency: 7 },
                weights: {
                    seed: { w_emotion_arousal: 0.21, w_social_currency: 0.18, w_practical_value: 0.09, w_info_advantage: 0.12, w_narrative_completeness: 0.125, w_remix_openness: 0.125, w_source_credibility: 0.105, w_personification: 0.045 },
                    S: { w_cognitive: 0.6, w_operational: 0.4 },
                    R: { w_content: 0.35, w_audience: 0.4, w_environment: 0.25 },
                    mu_psych: { w_antipathy: 0.6, w_suspicion: 0.4 },
                    trust: { w_source: 0.6, w_audience: 0.4 },
                    W: { w_enhance: 0.4, w_trust: 0.3, w_unique: 0.2, w_R: 0.1 }
                },
                mapping: {
                    K_pot: { base: 0.8, slope: 0.7, w_surge: 0.4, w_current: 0.4, w_terrain: 0.2 },
                    K_soil: { base: 0.3, slope: 1.2, w_density: 0.6, w_connect: 0.4 },
                    K_comp: { base: 1.0, slope: 0.7 },
                    omega: { scale: 2.5, denom: 1000 }
                }
            },
            scenario: {
                scores: { content_emotion_arousal: 6.0, social_currency_attr: 7.0, practical_value: 5.0, uniqueness: 6.0, innovation: 5.0, enhancement: 6.0, strangeness: 5.0, narrative_completeness: 7.0, remix_openness: 5.0, source_credibility: 6.0, personification: 5.0 },
                meme: { social_currency: 7.0, share_cost: 2.0, audience_trust_base: 7.0, share_circle_preference: 3.0 },
                field: { t: 0, C_t: 0.0, R_t: 7.1, R_0: 7.1, mu_psych_t: 2.08, K_pot_t: 1.0, K_pot_0: 1.0, K_soil: 1.05, K_comp: 0.65, K_base: 1.0, A_algo: 50.0, T: 4.0, T_effective: 3.2, challengability_score: 5.0, circle_opposition: 8.0, social_currency_t: 7.0 },
                env: { surge_match: 5.0, current_direction: 5.0, terrain_passability: 5.0, population_density: 6.0, connectivity: 5.0, raw_suppression: 5.0, L_cognitive: 3.0, L_operational: 2.0, L_antipathy: 3.0, content_emotion_intensity: 6.0, audience_resonance_match: 7.0, environment_emotion_fit: 5.0 }
            }
        },
        professional: {
            config: {
                system: { alpha: 0.2 },
                stochastic: { eta: 0.3, theta: 0.01, gamma_saturation: 0.5 },
                state_transfer: {
                    gamma_social_proof: 0.5, gamma_self_catalysis: 0.1, gamma_social_pressure: 0.3,
                    gamma_algo_trending: 0.05, attention_decay: 0.0, lambda_R_relaxation: 0.1,
                    lambda_K_relaxation: 0.1, lambda_C_relaxation: 0.3
                },
                omega: { trigger_T: 6, trigger_R: 7, trigger_social_currency: 7 },
                weights: {
                    seed: { w_emotion_arousal: 0.21, w_social_currency: 0.18, w_practical_value: 0.09, w_info_advantage: 0.12, w_narrative_completeness: 0.125, w_remix_openness: 0.125, w_source_credibility: 0.105, w_personification: 0.045 },
                    S: { w_cognitive: 0.6, w_operational: 0.4 },
                    R: { w_content: 0.35, w_audience: 0.4, w_environment: 0.25 },
                    mu_psych: { w_antipathy: 0.6, w_suspicion: 0.4 },
                    trust: { w_source: 0.6, w_audience: 0.4 },
                    W: { w_enhance: 0.4, w_trust: 0.3, w_unique: 0.2, w_R: 0.1 }
                },
                mapping: {
                    K_pot: { base: 0.8, slope: 0.7, w_surge: 0.4, w_current: 0.4, w_terrain: 0.2 },
                    K_soil: { base: 0.3, slope: 1.2, w_density: 0.9, w_connect: 0.4 },
                    K_comp: { base: 1.0, slope: 0.7 },
                    omega: { scale: 2.5, denom: 1000 }
                }
            },
            scenario: {
                scores: { content_emotion_arousal: 7.0, social_currency_attr: 6.0, practical_value: 6.0, uniqueness: 5.0, innovation: 4.0, enhancement: 5.0, strangeness: 3.0, narrative_completeness: 8.0, remix_openness: 4.0, source_credibility: 8.0, personification: 5.0 },
                meme: { social_currency: 7.0, share_cost: 6.0, audience_trust_base: 8.0, share_circle_preference: 3.0 },
                field: { t: 0, C_t: 0.0, R_t: 7.1, R_0: 7.1, mu_psych_t: 1.5, K_pot_t: 1.0, K_pot_0: 1.0, K_soil: 1.2, K_comp: 0.9, K_base: 1.0, A_algo: 7.0, T: 2.0, T_effective: 2.0, challengability_score: 5.0, circle_opposition: 8.0, social_currency_t: 7.0 },
                env: { surge_match: 5.0, current_direction: 5.0, terrain_passability: 5.0, population_density: 9.0, connectivity: 4.0, raw_suppression: 3.0, L_cognitive: 7.0, L_operational: 4.0, L_antipathy: 1.0, content_emotion_intensity: 7.0, audience_resonance_match: 9.0, environment_emotion_fit: 6.0 }
            }
        }
    };

    async function start() {
        await init();

        document.getElementById("run-btn").addEventListener("click", () => {
            const preset_key = document.getElementById("preset-selector").value;
            const target = presets[preset_key] || presets["video"];
            
            const max_ticks = parseInt(document.getElementById("ticks").value);
            const sigma = parseFloat(document.getElementById("sigma").value);
            const seed = BigInt(document.getElementById("seed").value);

            try {
                const result_string = simulate(
                    JSON.stringify(target.config),
                    JSON.stringify(target.scenario),
                    max_ticks,
                    sigma,
                    seed,
                    false
                );

                const records = JSON.parse(result_string);
                document.getElementById("json-output").textContent = JSON.stringify(records, null, 2);

                drawGrid(records);
                drawChart(records);
            } catch (err) {
                document.getElementById("json-output").textContent = "Simulation crashed: " + err;
            }
        });
    }

    function drawGrid(records) {
        const canvas = document.getElementById("grid-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const last_record = records[records.length - 1];
        const C_t = last_record.C_t;

        const cells = 12;
        const size = canvas.width / cells;
        for (let x = 0; x < cells; x++) {
            for (let y = 0; y < cells; y++) {
                const p = Math.random();
                const active = p < C_t;

                ctx.fillStyle = active ? `rgba(128, 90, 213, ${0.4 + C_t * 0.6})` : "#141a24";
                ctx.strokeStyle = "#1d2736";
                ctx.fillRect(x * size, y * size, size, size);
                ctx.strokeRect(x * size, y * size, size, size);
            }
        }
    }

    function drawChart(records) {
        const canvas = document.getElementById("chart-canvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const pad = 30;
        const w = canvas.width - pad * 2;
        const h = canvas.height - pad * 2;

        ctx.strokeStyle = "#4a5568";
        ctx.beginPath();
        ctx.moveTo(pad, pad); ctx.lineTo(pad, canvas.height - pad);
        ctx.lineTo(canvas.width - pad, canvas.height - pad);
        ctx.stroke();

        if (records.length === 0) return;

        const max_G = Math.max(...records.map(r => r.G), 2.0);
        
        ctx.strokeStyle = "#a78bfa";
        ctx.lineWidth = 2;
        ctx.beginPath();
        records.forEach((r, idx) => {
            const x = pad + (idx / (records.length - 1)) * w;
            const y = canvas.height - pad - (r.G / max_G) * h;
            if (idx === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);

            ctx.fillStyle = "#f472b6";
            ctx.beginPath();
            ctx.arc(x, y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.stroke();
    }

    start();
</script>
</body>
</html>
