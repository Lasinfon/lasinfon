[package]
name = "lasinfon-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lasinfon"
path = "src/main.rs"

[dependencies]
lasinfon-core = { path = "../core" }
lasinfon-state = { path = "../state" }
lasinfon-config = { path = "../config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
